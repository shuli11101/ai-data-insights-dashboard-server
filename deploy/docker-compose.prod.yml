# 生产编排：server + ai-service + nginx + redis + minio
#
# 启动（必须在 deploy 目录下，并显式指定环境变量文件）：
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# 服务器目录要求：
#   /opt/ai-insights/
#     ├── server/            <- 后端代码（本文件位于 server/deploy/）
#     │   └── deploy/
#     │       ├── docker-compose.prod.yml
#     │       ├── .env.prod
#     │       ├── nginx/default.conf
#     │       ├── html/      <- 放 dataDashboard 的 dist 内容
#     │       └── logs/
#     └── ai-service/        <- AI 服务代码

name: ai-data-insights

services:
  # ---------- 业务后端 ----------
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ai-data-insights-server:latest
    container_name: ai-insights-server
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 覆盖为容器网络内的地址，不依赖 .env.prod 里的值
      AI_BASE_URL: http://ai-service:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_PATH: /app/logs
    volumes:
      - ./logs/server:/app/logs
      # local 存储时的头像目录；用 S3/OSS 时可以不挂
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 只绑本机，方便在服务器上用 curl 排查；对外统一走 nginx
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - backend

  # ---------- AI 推理服务（仅内网） ----------
  ai-service:
    build:
      # 服务器上按 README 的目录布局，默认 ../../ai-service 即可
      # 本地目录名不一致时，用 .env.prod 里的 AI_SERVICE_CONTEXT 覆盖
      context: ${AI_SERVICE_CONTEXT:-../../ai-service}
      dockerfile: Dockerfile
    image: ai-data-insights-ai:latest
    container_name: ai-insights-ai
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      AI_PROVIDER: deepseek
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ---------- 反向代理 ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-insights-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - backend

  # ---------- MySQL（自带容器；改用云 RDS 时删掉本服务，MYSQL_HOST 改成 RDS 地址） ----------
  # 首次启动会自动执行 sql/initdb/ 下的脚本（结构 + 业务数据）
  mysql:
    image: mysql:8.4
    container_name: ai-insights-mysql
    restart: unless-stopped
    environment:
      # root 仅用于健康检查和容器初始化
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 应用连接用的业务账号，镜像会自动创建并授权到 MYSQL_DATABASE
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 中间的 $$ 是 Compose 转义，容器内才能取到 MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - backend

  # ---------- Redis（仅内网，不映射宿主机端口） ----------
  redis:
    image: redis:7-alpine
    container_name: ai-insights-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ---------- MinIO（S3 兼容，仅在启用 s3 profile 时启动）----------
  # 用法：docker compose --profile s3 up -d
  # 默认不启动：镜像站在部分网络下会拒绝 minio/minio 镜像，且生产建议直接用 OSS/COS
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    container_name: ai-insights-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      # 9000 需要被浏览器访问（头像直链），9001 是控制台
      - "9000:9000"
      - "9001:9001"
    networks:
      - backend

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  backend:
    driver: bridge