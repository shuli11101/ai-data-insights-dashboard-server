server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: ai-data-insights-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

# ============ MyBatis-Plus ============
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aidata.insights.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============ 接口文档 ============
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
  # 生产环境可开启接口文档访问密码
  basic:
    enable: false
    username: knife4j
    password: knife4j

# ============ 业务自定义配置 ============
app:
  upload:
    # 头像存储方式：local 本地磁盘（开发默认），s3 对象存储（线上，MinIO/OSS/COS 通用）
    storage-type: ${UPLOAD_STORAGE_TYPE:local}
    # 仅 storage-type=local 时生效：上传文件根目录，静态映射 /uploads/** 指向它
    root-dir: ${UPLOAD_ROOT_DIR:./uploads}
    # 仅 storage-type=local 时生效：头像存储目录，必须位于 root-dir 下
    avatar-dir: ${AVATAR_DIR:./uploads/avatar}
    # 仅 storage-type=local 时生效：头像访问前缀，相对 context-path
    avatar-url-prefix: /uploads/avatar
    # 单个头像大小上限（字节），默认 2MB
    avatar-max-size: 2097152
    allowed-extensions: [ jpg, jpeg, png, webp ]
    # 仅 storage-type=s3 时生效
    s3:
      # MinIO 地址，如 http://127.0.0.1:9000；阿里云 OSS 填 https://oss-cn-shenzhen.aliyuncs.com
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # 桶名，不存在时启动阶段自动创建
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:us-east-1}
      # MinIO 必须 true
      path-style-access: ${S3_PATH_STYLE:true}
      # 对外访问前缀（CDN 域名或桶的公网地址），留空则用 endpoint/bucket 拼接
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  # 短信验证码
  sms:
    # 发送通道：log 只打印日志（开发用）；接入真实服务商后新增实现并改这里
    provider: ${SMS_PROVIDER:log}
    code-length: 6
    # 验证码有效期
    code-ttl: 5m
    # 同一手机号重发间隔
    resend-interval: 60s
    # 同一手机号每日发送上限
    daily-limit: 10
    # 同一验证码允许的最大校验失败次数，超过后作废
    max-verify-attempts: 5
    # 失败计数窗口
    fail-window: 10m
    # 同一 IP 每小时发送上限
    ip-hourly-limit: 20
    # 阿里云短信，provider=aliyun（常规短信服务）或 aliyun-auth（短信认证服务，个人认证可用）
    aliyun:
      access-key-id: ${SMS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:}
      # 短信签名：provider=aliyun 填已审核签名；provider=aliyun-auth 填控制台赠送签名（不支持自定义）
      sign-name: ${SMS_ALIYUN_SIGN_NAME:}
      # 模板 CODE：provider=aliyun 填 SMS_xxx；provider=aliyun-auth 填赠送模板编号 100001~100005
      template-code: ${SMS_ALIYUN_TEMPLATE_CODE:}
      # 短信认证服务的方案名称，非必填，不填则为“默认方案”
      scheme-name: ${SMS_ALIYUN_SCHEME_NAME:}
      # 模板变量名，模板内容为 ${code} 时保持 code
      template-param-name: ${SMS_ALIYUN_TEMPLATE_PARAM_NAME:code}
      # 赠送模板中有效期变量名（分钟），短信认证服务赠送模板同时含验证码与有效期两个变量
      validity-param-name: ${SMS_ALIYUN_VALIDITY_PARAM_NAME:min}
      # 常规短信服务网关
      endpoint: ${SMS_ALIYUN_ENDPOINT:dysmsapi.aliyuncs.com}
      # 短信认证服务网关（与上者不同）
      auth-endpoint: ${SMS_ALIYUN_AUTH_ENDPOINT:dypnsapi.aliyuncs.com}
  # AI 推理服务（FastAPI）
  ai:
    # FastAPI 地址，仅内网可达
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    # 服务间令牌，必须与 FastAPI 的 AI_INTERNAL_TOKEN 一致
    internal-token: ${AI_INTERNAL_TOKEN:change-me}
    connect-timeout: 5s
    # 流式超时需大于 FastAPI 侧 request-timeout
    stream-timeout: 180s
    # 每次带入模型的历史消息条数
    max-history-messages: 20
    # 系统提示词默认由 FastAPI 按 scene 下发（app/prompts.py）；仅在需要紧急覆盖时取消注释
    # system-prompt: 你是招聘数据分析助手，回答要简洁、准确，必要时用 Markdown 输出
    
    # 流式任务线程池：有界队列，饱和后快速失败并由接口返回友好提示
    executor:
      # 常驻线程数
      core-size: ${AI_EXECUTOR_CORE:8}
      # 峰值线程上限，达到后任务进入队列
      max-size: ${AI_EXECUTOR_MAX:32}
      # 排队上限，队列也满时直接拒绝；过大会拉长排队等待，需小于前端超时
      queue-capacity: ${AI_EXECUTOR_QUEUE:100}
      # 线程名前缀，日志中用于区分流式任务线程
      thread-name-prefix: ${AI_EXECUTOR_PREFIX:ai-stream-}
      # 停机时等待任务响应中断的秒数，应与 server.shutdown 的 20s 匹配
      await-termination-seconds: ${AI_EXECUTOR_AWAIT:20}

security:
  jwt:
    # 与既有 Node 服务共用同一密钥，保证历史签发的令牌仍可被识别；生产环境务必用环境变量覆盖
    secret: ${JWT_SECRET:7f3c9a1e5b8d2f6a4c0e9b7d3a1f8c5e2b6d4a9f7c3e1b8d5a2f6c9e4b7d1a3f}
    # 令牌有效期（分钟），7 天
    expire-minutes: ${JWT_EXPIRE_MINUTES:10080}
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
      - http://127.0.0.1:3000
    allowed-methods: [ GET, POST, PUT, DELETE, PATCH, OPTIONS ]
    allowed-headers: [ "*" ]
    allow-credentials: true
    max-age: 3600

logging:
  level:
    root: info
    com.aidata.insights: debug

management:
  endpoints:
    web:
      exposure:
        # metrics 用于观测线程池等运行指标，需要 JWT 才能访问（不在白名单中）
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: when-authorized
