server {
    listen 80;
    server_name _;

    # 与 spring.servlet.multipart.max-request-size 保持一致
    client_max_body_size 50m;

    # ---------- 前端（Vue3 + Vite，history 路由）----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # history 模式必须：刷新 /aiAnalyse 这类子路由时回落到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口页不能缓存，否则发版后用户还拿旧页面去加载新 hash 的资源
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        # 结尾不要加 /：后端 context-path 是 /api，加斜杠会把前缀吃掉导致 404
        proxy_pass http://server:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出必须关缓冲，否则 AI 回复会攒到最后一次性刷出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}